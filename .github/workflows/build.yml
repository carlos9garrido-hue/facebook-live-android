name: Compilar APK

on:
  push:
    branches: [main, facebook-login]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compilar APK debug
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Execution failed|Could not resolve|AAPT" -A2 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Errores de compilacion::$msg"
          fi
          exit $code

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: facebook-live-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK compilación ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
